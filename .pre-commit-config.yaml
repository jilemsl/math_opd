repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.13.3
    hooks:
      - id: ruff-check
        types_or: [ python, pyi ]
        args: [ --fix ]
      - id: ruff-format
        types_or: [ python, pyi ]

  - repo: https://github.com/huggingface/doc-builder
    rev: 9f9bb430a712b5650d0e43e510656098ecdd75d4  # main
    hooks:
      - id: doc-builder-style
        args: [--max_len, "119"]
        files: ^(trl|tests|docs/source)/
