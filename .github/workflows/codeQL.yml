name: "CodeQL Analysis - Workflows"

on:
  workflow_dispatch:

jobs:
  analyze:
    name: "Analyze GitHub Workflows"
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: "Initialize CodeQL"
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d  # v4.38.3
        with:
          languages: "actions"
          queries: +security-and-quality, ./.github/codeql/custom-queries.qls

      - name: "Perform CodeQL Analysis"
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d  # v4.38.3
